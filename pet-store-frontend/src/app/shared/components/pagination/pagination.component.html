@if (totalPages() > 1) {
  <div class="pagination-container">
    <button 
      class="btn btn-secondary btn-sm" 
      [disabled]="!hasPrevious()" 
      (click)="onPrevious()">
      &larr; Previous
    </button>
    <span class="page-indicator">
      Page <strong>{{ displayPage() }}</strong> of <strong>{{ totalPages() }}</strong>
    </span>
    <button 
      class="btn btn-secondary btn-sm" 
      [disabled]="!hasNext()" 
      (click)="onNext()">
      Next &rarr;
    </button>
  </div>
}
