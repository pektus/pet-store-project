    @if (isOpen()) {
      <div class="modal-overlay" (click)="close.emit()">
        <div class="modal-content form-modal" (click)="$event.stopPropagation()">
          <div class="modal-header">
            <h3>{{ petToEdit() ? 'Edit Pet Profile' : 'Add New Pet' }}</h3>
            <button class="close-btn" (click)="close.emit()">&times;</button>
          </div>

          <form (ngSubmit)="onSubmit()">
            <div class="modal-body form-body">
              @if (errorMessage()) {
                <div class="error-alert">{{ errorMessage() }}</div>
              }

              <!-- Image Upload Section -->
              <div class="form-group">
                <label>Pet Picture</label>
                <div class="media-upload-area">
                  @if (photoUrl()) {
                    <div class="preview-container">
                      <img [src]="photoUrl()" alt="Preview" class="preview-img" />
                      <button type="button" class="btn btn-danger btn-sm remove-photo" (click)="removePhoto()">
                        Remove
                      </button>
                    </div>
                  } @else {
                    <div class="upload-dropzone">
                      <input 
                        type="file" 
                        accept="image/jpeg,image/png,image/webp" 
                        (change)="onFileSelected($event)" 
                        id="fileUpload" 
                        class="file-input" />
                      <label for="fileUpload" class="upload-label">
                        <span class="upload-icon">&#128247;</span>
                        <span>{{ isUploading() ? 'Uploading...' : 'Click to select picture (JPEG, PNG, WebP &le; 5MB)' }}</span>
                      </label>
                    </div>
                  }
                </div>
              </div>

              <div class="form-row">
                <div class="form-group flex-1">
                  <label for="name">Pet Name *</label>
                  <input 
                    id="name" 
                    type="text" 
                    required 
                    [ngModel]="name()" 
                    (ngModelChange)="name.set($event)" 
                    name="name" 
                    class="form-control" />
                </div>

                <div class="form-group flex-1">
                  <label for="category">Category / Species *</label>
                  <select 
                    id="category" 
                    [ngModel]="category()" 
                    (ngModelChange)="category.set($event)" 
                    name="category" 
                    class="form-control">
                    <option value="Dog">Dog</option>
                    <option value="Cat">Cat</option>
                    <option value="Bird">Bird</option>
                    <option value="Fish">Fish</option>
                    <option value="Reptile">Reptile</option>
                    <option value="Small Animal">Small Animal</option>
                    <option value="Other">Other</option>
                  </select>
                </div>
              </div>

              <div class="form-row">
                <div class="form-group flex-1">
                  <label for="breed">Breed *</label>
                  <input 
                    id="breed" 
                    type="text" 
                    required 
                    [ngModel]="breed()" 
                    (ngModelChange)="breed.set($event)" 
                    name="breed" 
                    class="form-control" />
                </div>

                <div class="form-group flex-1">
                  <label for="age">Age (Months) *</label>
                  <input 
                    id="age" 
                    type="number" 
                    min="0" 
                    max="360" 
                    required 
                    [ngModel]="ageMonths()" 
                    (ngModelChange)="ageMonths.set($event)" 
                    name="ageMonths" 
                    class="form-control" />
                </div>
              </div>

              <div class="form-row">
                <div class="form-group flex-1">
                  <label for="price">Price ($) *</label>
                  <input 
                    id="price" 
                    type="number" 
                    step="0.01" 
                    min="0" 
                    required 
                    [ngModel]="price()" 
                    (ngModelChange)="price.set($event)" 
                    name="price" 
                    class="form-control" />
                </div>

                <div class="form-group flex-1">
                  <label for="status">Inventory Status *</label>
                  <select 
                    id="status" 
                    [ngModel]="status()" 
                    (ngModelChange)="status.set($event)" 
                    name="status" 
                    class="form-control">
                    <option value="AVAILABLE">AVAILABLE</option>
                    <option value="PENDING">PENDING</option>
                    <option value="ADOPTED">ADOPTED</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label for="desc">Description</label>
                <textarea 
                  id="desc" 
                  rows="3" 
                  [ngModel]="description()" 
                  (ngModelChange)="description.set($event)" 
                  name="description" 
                  class="form-control" 
                  placeholder="Temperament, health records, behavior..."></textarea>
              </div>
            </div>

            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" (click)="close.emit()">Cancel</button>
              <button 
                type="submit" 
                class="btn btn-primary" 
                [disabled]="isSaving() || isUploading() || !name() || !breed()">
                {{ isSaving() ? 'Saving...' : (petToEdit() ? 'Update Pet' : 'Create Pet') }}
              </button>
            </div>
          </form>
        </div>
      </div>
    }
