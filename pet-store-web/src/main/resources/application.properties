# ==============================================================================
# Pet Store Application Configuration (Pure Spring 7 / Java 21)
# ==============================================================================

# Database Connection (HikariCP / PostgreSQL)
db.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/petstoredb}
db.username=${JDBC_DATABASE_USERNAME:postgres}
db.password=${JDBC_DATABASE_PASSWORD:postgres}
db.driver-class-name=org.postgresql.Driver
db.pool.max-size=10
db.pool.min-idle=2
db.pool.connection-timeout=30000
db.pool.idle-timeout=600000
db.pool.max-lifetime=1800000

# Hibernate ORM Settings
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.show_sql=false
hibernate.format_sql=false
hibernate.hbm2ddl.auto=validate

# Flyway Database Migration
flyway.locations=classpath:db/migration
flyway.baseline-on-migrate=true

# Security & JWT Configuration
# HMAC-SHA256 Secret (256-bit hexadecimal string)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=86400000
jwt.issuer=PetStoreApp

# Local Filesystem Storage Configuration
app.storage.upload-dir=uploads

# Cross-Origin Resource Sharing (CORS)
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
